<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CARTUNIZE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d22;--side:#071230;--card:#0a1738;--card2:#0f2050;--line:#1a3466;--txt:#eaf2ff;--mut:#8fa5cc;--blue:#1f7bff;--cyan:#27d3ff;--red:#ff5d6c;--green:#2ddc8f;--gold:#ffb21e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
a{color:var(--cyan)}
.hide{display:none!important}
.btn{padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;background:linear-gradient(90deg,#1f7bff,#0b50d8);color:#fff}
.btn.s{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.g{background:var(--card2);border:1px solid var(--line)}
.btn.r{background:rgba(255,93,108,.15);color:var(--red);border:1px solid rgba(255,93,108,.4)}
.btn.ok{background:rgba(45,220,143,.15);color:var(--green);border:1px solid rgba(45,220,143,.4)}
input,textarea,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-family:inherit;font-size:14px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
label small{color:var(--mut);font-weight:400}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.lbox h1{font-size:22px;margin-bottom:4px}
.lbox p{color:var(--mut);font-size:13px;margin-bottom:10px}
.err{color:var(--red);font-size:13px;margin-top:12px;word-break:break-word}
.uid{background:var(--bg);border:1px dashed var(--line);padding:10px;border-radius:10px;font-size:12px;word-break:break-all;margin:8px 0}

/* layout */
#app{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.side h2{font-size:18px;padding:4px 10px 16px;background:linear-gradient(90deg,#ffb21e,#27d3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.side button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:10px;background:none;font-size:14px;font-weight:500;margin-bottom:3px;color:var(--mut)}
.side button.on,.side button:hover{background:var(--card2);color:var(--txt)}
.main{flex:1;min-width:0;padding:22px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.bar h1{font-size:22px}
.mbtn{display:none}
@media(max-width:820px){
  .side{position:fixed;left:-260px;z-index:30;transition:left .25s;width:240px}
  .side.on{left:0}
  .mbtn{display:inline-block}
  .main{padding:14px}
}

/* cards & lists */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{font-size:26px;display:block}.stat small{color:var(--mut)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.item .th{width:56px;height:56px;border-radius:12px;background:var(--card2);flex:none;display:grid;place-items:center;font-size:24px;overflow:hidden}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.off{opacity:.55}
.badge{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:12px;background:rgba(255,178,30,.18);color:var(--gold);margin-left:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.panel h3{font-size:16px;margin-bottom:4px;color:var(--cyan)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.pv{margin-top:8px;max-height:130px;border-radius:10px;border:1px solid var(--line);display:none}
.chk{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600;font-size:14px}
.chk input{width:20px;height:20px}
.hint{background:rgba(31,123,255,.1);border:1px solid rgba(31,123,255,.35);border-radius:12px;padding:12px 14px;font-size:13px;color:#bcd2ff;margin-bottom:16px;line-height:1.6}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:60;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal.on{display:flex}
.mbox{background:var(--side);border:1px solid var(--line);border-radius:20px;width:100%;max-width:640px;padding:22px;margin:auto}
.mbox h2{font-size:19px;margin-bottom:4px}
.mf{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--blue);padding:12px 20px;border-radius:12px;font-size:14px;z-index:99;display:none}
.toast.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <h1>CARTUNIZE Admin</h1>
    <p>অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>
    <label>Email</label><input id="em" type="email" autocomplete="username">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:18px" id="loginBtn">Login</button>
    <button class="btn g s" style="margin-top:10px" id="resetBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
    <div class="err hide" id="lerr"></div>
    <div class="hide" id="notAdmin">
      <div class="err">এই অ্যাকাউন্ট অ্যাডমিন হিসেবে সেট করা নেই। Firebase Console > Realtime Database এ <b>admins/আপনার-UID = true</b> বসান।</div>
      <div class="uid" id="uidBox"></div>
      <button class="btn g s" id="outBtn">Logout</button>
    </div>
    <p style="margin-top:16px"><a href="index.html">← সাইটে ফিরুন</a></p>
  </div>
</div>

<div id="app" class="hide">
  <aside class="side" id="side">
    <h2>CARTUNIZE Admin</h2>
    <div id="nav"></div>
    <button id="logout" style="margin-top:14px;color:var(--red)">🚪 Logout</button>
    <a href="index.html" target="_blank" style="display:block;padding:11px 12px;font-size:14px">🌐 সাইট দেখুন</a>
  </aside>
  <div class="main">
    <div class="bar"><div style="display:flex;gap:10px;align-items:center"><button class="btn g s mbtn" id="menuBtn">☰</button><h1 id="title"></h1></div><div id="barBtns"></div></div>
    <div id="content"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="mbox"><h2 id="mTitle"></h2><div id="mBody"></div>
  <div class="mf"><button class="btn g" id="mCancel">বাতিল</button><button class="btn" id="mSave">সেভ করুন</button></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="demo-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
